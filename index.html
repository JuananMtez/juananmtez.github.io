<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Redirect</title>
    <script>
        // Detect the user's preferred language
        const userLang = navigator.language || navigator.userLanguage; // e.g., "en-US", "es-ES"

        // Extract the first part of the language code (e.g., "en" from "en-US")
        const languageCode = userLang.split('-')[0];

        // Define supported languages
        const supportedLanguages = ['en', 'es']; // Add other language codes as needed

        // Redirect to the corresponding folder or a default language
        if (supportedLanguages.includes(languageCode)) {
            window.location.href = `/${languageCode}`;
        } else {
            // Default to English if the language is unsupported
            window.location.href = '/en';
        }
    </script>
</head>
<body>
    <p>Redirecting to your language...</p>
</body>
</html>
